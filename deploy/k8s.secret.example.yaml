# Copy to a real Secret. Do not commit live credentials.
apiVersion: v1
kind: Secret
metadata:
  name: circuitbreaker-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://USER:PASSWORD@circuitbreaker-postgres:5432/circuitbreaker
  API_KEY_READ: replace-me
  API_KEY_WRITE: replace-me
  POSTGRES_USER: circuitbreaker
  POSTGRES_PASSWORD: replace-me
  POSTGRES_DB: circuitbreaker
  WEBHOOK_URL: ""
