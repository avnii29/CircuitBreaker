apiVersion: v1
kind: ConfigMap
metadata:
  name: circuitbreaker-config
data:
  DEMO_MODE: "false"
  RECOVERY_WINDOW_SECONDS: "180"
  MAX_RECOVERY_ATTEMPTS: "3"
  MAX_CART_HOLD_SECONDS: "180"
  LLM_PROVIDER: "simulated"
  AUTO_CREATE_SCHEMA: "false"
  WORKER_ENABLED: "true"
  REDIS_URL: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: circuitbreaker-pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuitbreaker-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circuitbreaker-postgres
  template:
    metadata:
      labels:
        app: circuitbreaker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: circuitbreaker-secrets
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "circuitbreaker"]
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: circuitbreaker-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: circuitbreaker-postgres
spec:
  selector:
    app: circuitbreaker-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuitbreaker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: circuitbreaker-api
  template:
    metadata:
      labels:
        app: circuitbreaker-api
    spec:
      containers:
        - name: api
          image: circuitbreaker-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: circuitbreaker-config
            - secretRef:
                name: circuitbreaker-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: circuitbreaker-api
spec:
  selector:
    app: circuitbreaker-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuitbreaker-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circuitbreaker-web
  template:
    metadata:
      labels:
        app: circuitbreaker-web
    spec:
      containers:
        - name: web
          image: circuitbreaker-web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: circuitbreaker-web
spec:
  selector:
    app: circuitbreaker-web
  ports:
    - port: 80
      targetPort: 80
