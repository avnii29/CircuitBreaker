services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      API_KEY_READ: ${API_KEY_READ}
      API_KEY_WRITE: ${API_KEY_WRITE}
      API_KEY_OPS: ${API_KEY_OPS:-}
      TENANT_KEYS_JSON: ${TENANT_KEYS_JSON:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_RECOVERY_WINDOW_SECONDS: ${DEMO_RECOVERY_WINDOW_SECONDS:-30}
      RECOVERY_WINDOW_SECONDS: ${RECOVERY_WINDOW_SECONDS:-180}
      MAX_RECOVERY_ATTEMPTS: ${MAX_RECOVERY_ATTEMPTS:-3}
      MAX_CART_HOLD_SECONDS: ${MAX_CART_HOLD_SECONDS:-180}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      AUTO_CREATE_SCHEMA: "false"
      LLM_PROVIDER: simulated
      WORKER_ENABLED: "true"
      CIRCUIT_FAILURE_RATE_THRESHOLD: ${CIRCUIT_FAILURE_RATE_THRESHOLD:-0.30}
      CIRCUIT_MIN_SAMPLES: ${CIRCUIT_MIN_SAMPLES:-8}
      CIRCUIT_WINDOW_SECONDS: ${CIRCUIT_WINDOW_SECONDS:-60}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_API_KEY: ${API_KEY_WRITE}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
